trigger:
- 

jobs:
- job: iOS
  displayName: 'iOS'
  pool:
    vmImage: 'macos-15' ###  explicit is later than 'latest' as of 4/7/2025

  steps:
  - task: UseDotNet@2
    displayName: '.NET Version'
    inputs:
      packageType: 'sdk'
      version: '$(DotNetVersion)'

  - task: Bash@3
    displayName: 'Install MAUI'
    inputs:
      targetType: 'inline'
      script: |
        dotnet workload restore

  - task: Bash@3
    displayName: 'NuGet auth and restore'
    inputs:
      targetType: 'inline'
      script: |
        dotnet nuget remove source kra3030
        dotnet nuget add source https://pkgs.dev.azure.com/kra3030/_packaging/kra3030/nuget/v3/index.json -n "kra3030" -u "whatever" -p "$(NuGetPAT)" --store-password-in-clear-text --valid-authentication-types "basic"
        dotnet restore

  - task: InstallAppleCertificate@2
    inputs:
      certSecureFile: 'distro.p12'
      certPwd: '$(p12pwd)'
      keychain: 'temp'

  - task: InstallAppleProvisioningProfile@1
    inputs:
      provisioningProfileLocation: 'secureFiles'
      provProfileSecureFile: 'CrossCam_Distribution.mobileprovision'

  - task: InstallAppleProvisioningProfile@1
    inputs:
      provisioningProfileLocation: 'secureFiles'
      provProfileSecureFile: 'CrossCam_Share_Extension_Distribution.mobileprovision'

  - task: Bash@3
    displayName: 'Set version numbers'
    inputs:
      targetType: 'inline'
      script: |
        sed -i '' 's/<string>1.0<\/string>/<string>$(myVersionNumber)<\/string>/g' CrossCamMaui/Platforms/iOS/Info.plist
        sed -i '' 's/<string>10.0<\/string>/<string>$(myVersionNumber)<\/string>/g' CrossCamShareExtension.iOS/Info.plist
        echo "MAIN PLIST"
        cat CrossCamMaui/Platforms/iOS/Info.plist
        echo "EXTENSION PLIST"
        cat CrossCamShareExtension.iOS/Info.plist

  - task: Bash@3
    displayName: 'dotnet publish ios'
    inputs:
      targetType: 'inline'
      script: 'dotnet publish -f net9.0-ios -p:ArchiveOnBuild=true'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Pipeline.Workspace)/s/CrossCamMaui/bin/Release/net8.0-ios/ios-arm64/publish/CrossCam.ipa'
      publishLocation: 'pipeline'

  - task: AppStoreRelease@1
    inputs:
      serviceEndpoint: 'App Store Connect API'
      releaseTrack: 'TestFlight'
      appType: 'iOS'
      shouldSkipWaitingForProcessing: true

- job: Android
  displayName: 'Android'
  # Xamarin.Android
  # Build a Xamarin.Android project.
  # Add steps that test, sign, and distribute an app, save build artifacts, and more:
  # https://docs.microsoft.com/azure/devops/pipelines/languages/xamarin
  pool:
    vmImage: 'windows-latest'

  variables:
    buildConfiguration: 'Release'
    outputDirectory: '$(build.binariesDirectory)/$(buildConfiguration)'

  steps:
  
  - task: UseDotNet@2
    displayName: '.NET Version'
    inputs:
      packageType: 'sdk'
      version: '$(DotNetVersion)'

  - task: Bash@3
    displayName: 'Install MAUI'
    inputs:
      targetType: 'inline'
      script: |
        dotnet workload restore

  - task: NuGetToolInstaller@1

  - task: NuGetCommand@2
    inputs:
      command: 'restore'
      restoreSolution: '**/*.sln'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'
      externalFeedCredentials: 'NuGet'

  - task: Bash@3
    displayName: 'Set version numbers'
    inputs:
      targetType: 'inline'
      script: |
        sed -i 's/android:versionCode="1"/android:versionCode="$(buildNumber)"/g' CrossCamMaui/Platforms/Android/AndroidManifest.xml
        sed -i 's/android:versionName="1.0"/android:versionName="$(myVersionNumber)"/g' CrossCamMaui/Platforms/Android/AndroidManifest.xml
        cat CrossCamMaui/Platforms/Android/AndroidManifest.xml

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '11'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - task: Bash@3
    displayName: 'Set java variables'
    inputs:
      targetType: 'inline'
      script: |
        echo "##vso[task.setvariable variable=JAVA_HOME]$(JAVA_HOME_11_X64)"
        echo "##vso[task.setvariable variable=PATH]$(JAVA_HOME_11_X64)\bin;$(PATH)"

  - task: DownloadSecureFile@1
    name: androidKeystore
    inputs:
      secureFile: 'kra2008Android.keystore'

  - task: Bash@3
    displayName: 'Build Android App'
    inputs:
      targetType: 'inline'
      script: 'dotnet publish -f net9.0-android -c Release -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=D:/a/_temp/kra2008Android.keystore -p:AndroidSigningKeyPass=$(keystorePassword) -p:AndroidSigningStorePass=$(keystorePassword) -p:AndroidSigningKeyAlias=kra2008android'

  - task: CopyFiles@2
    displayName: 'Copy build output to staging'
    inputs:
      SourceFolder: '$(Agent.BuildDirectory)\s\CrossCamMaui\bin\Release\net8.0-android\publish'
      Contents: |
        **/*.apk
        **/*.aab
      TargetFolder: '$(ArtifactStagingDirectory)'
      flattenFolders: true

  - publish: $(ArtifactStagingDirectory)
    artifact: Android